<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock KSG</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');

        :root {
            --primary: #007aff;       
            --primary-dark: #0056b3;
            --primary-glow: rgba(0, 122, 255, 0.45);
            --secondary: #64748b;     
            --bg-body: #e2e8f0;       

            /* 💧 Liquid Glass Variables (Light Mode) */
            --bg-card: rgba(255, 255, 255, 0.32);
            --border-card: rgba(255, 255, 255, 0.75);
            --input-bg: rgba(255, 255, 255, 0.25);
            --input-border: rgba(255, 255, 255, 0.6);
            --text-main: #0f172a;     
            --text-muted: #475569;    
            --success-bg: rgba(34, 197, 94, 0.2);
            --success-text: #15803d;
            --error-bg: rgba(239, 68, 68, 0.2);
            --error-text: #b91c1c; 
            --highlight-bg: rgba(250, 204, 21, 0.25);  
            --highlight-border: #eab308;
            --small-bg: rgba(249, 115, 22, 0.22);
            --small-border: #ea580c;
            --table-header-bg: rgba(255, 255, 255, 0.25);
            --table-summary-bg: rgba(0, 122, 255, 0.15);
            --table-summary-border: rgba(0, 122, 255, 0.25);
            --table-row-border: rgba(255, 255, 255, 0.35);
            --table-track: transparent;
            --table-thumb: rgba(255, 255, 255, 0.5);
            --radius: 26px;
            
            --shadow: 0 20px 50px rgba(0, 0, 0, 0.08), 
                      inset 0 1px 1px 0 rgba(255, 255, 255, 0.9),
                      inset 0 -1px 2px 0 rgba(0, 0, 0, 0.05);
            --glass-blur: blur(35px) saturate(210%);
            
            --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease-smooth: cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* 🌙 Dark Mode Liquid Glass */
        body.dark-mode {
            --primary: #0a84ff;
            --primary-dark: #409cff;
            --primary-glow: rgba(10, 132, 255, 0.55);
            --secondary: #94a3b8;
            --bg-body: #030712;

            --bg-card: rgba(15, 23, 42, 0.38);
            --border-card: rgba(255, 255, 255, 0.2);
            --input-bg: rgba(255, 255, 255, 0.07);
            --input-border: rgba(255, 255, 255, 0.18);
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --success-bg: rgba(34, 197, 94, 0.22);
            --success-text: #4ade80;
            --error-bg: rgba(239, 68, 68, 0.25);
            --error-text: #f87171;
            --highlight-bg: rgba(234, 179, 8, 0.2);
            --highlight-border: #facc15;
            --small-bg: rgba(249, 115, 22, 0.2);
            --small-border: #fb923c;
            --table-header-bg: rgba(255, 255, 255, 0.06);
            --table-summary-bg: rgba(10, 132, 255, 0.22);
            --table-summary-border: rgba(10, 132, 255, 0.35);
            --table-row-border: rgba(255, 255, 255, 0.08);
            --table-track: transparent;
            --table-thumb: rgba(255, 255, 255, 0.25);
            --shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 
                      inset 0 1px 1px 0 rgba(255, 255, 255, 0.25),
                      inset 0 -1px 2px 0 rgba(0, 0, 0, 0.4);
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Sarabun', sans-serif;
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(at 15% 15%, rgba(0, 122, 255, 0.4) 0px, transparent 55%),
                radial-gradient(at 85% 25%, rgba(217, 70, 239, 0.35) 0px, transparent 50%),
                radial-gradient(at 50% 85%, rgba(20, 184, 166, 0.35) 0px, transparent 55%);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0; padding: 20px; height: 100vh;
            overflow: hidden;
            opacity: 0; animation: fadeInPage 0.8s var(--ease-smooth) forwards;
            transition: background 0.6s var(--ease-smooth), color 0.6s var(--ease-smooth);
        }
        @keyframes fadeInPage { to { opacity: 1; } }

        .logo {
            position: fixed; top: 20px; right: 20px; width: 90px; height: auto; z-index: 1000;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.15));
            transition: transform 0.3s var(--ease-elastic);
        }
        .logo:hover { transform: scale(1.08) rotate(-2deg); }

        .version-tag {
            position: fixed; bottom: 10px; right: 15px; font-size: 0.8rem;
            color: var(--text-muted); opacity: 0.6; z-index: 500; pointer-events: none;
        }

        /* 🔘 Floating Theme Toggle */
        .theme-toggle-btn {
            position: fixed; bottom: 18px; left: 18px;
            width: 46px; height: 46px; border-radius: 50%;
            background: var(--bg-card); color: var(--text-main);
            backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-card);
            box-shadow: var(--shadow);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 1.25rem; z-index: 1000;
            transition: all 0.4s var(--ease-elastic);
            user-select: none;
        }
        .theme-toggle-btn:hover {
            transform: scale(1.15) rotate(15deg);
            box-shadow: 0 10px 25px rgba(0, 122, 255, 0.3);
        }
        .theme-toggle-btn:active { transform: scale(0.9); }

        .layout-container {
            display: grid; grid-template-columns: 1fr 1.55fr; gap: 25px;
            max-width: 1100px; margin: 60px auto 0; align-items: start;
        }

        /* 💧 Glass Card */
        .card {
            background: var(--bg-card); border-radius: var(--radius); padding: 25px;
            backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
            box-shadow: var(--shadow); border: 1px solid var(--border-card);
            animation: slideUp 0.6s var(--ease-smooth);
            transition: background 0.4s var(--ease-smooth), border-color 0.4s var(--ease-smooth), box-shadow 0.4s var(--ease-smooth), transform 0.3s var(--ease-smooth);
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .card h2 { 
            margin-top: 0; color: var(--text-main); font-weight: 700; font-size: 1.5rem; 
            margin-bottom: 20px; letter-spacing: -0.5px;
            text-shadow: 0 1px 3px rgba(255,255,255,0.4);
        }
        body.dark-mode .card h2 { text-shadow: 0 1px 3px rgba(0,0,0,0.4); }

        .form-group { margin-bottom: 20px; position: relative; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-muted); font-weight: 500; font-size: 0.95rem; }

        .native-hidden-select { display: none !important; }

        /* 🧊 Liquid Glass Custom Dropdown */
        .glass-select-container { position: relative; width: 100%; user-select: none; }
        
        .glass-select-trigger {
            width: 100%; padding: 14px 18px;
            border: 1px solid var(--input-border); border-radius: 16px;
            font-size: 1rem; font-weight: 500; color: var(--text-main); background: var(--input-bg);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.4), 0 2px 8px rgba(0,0,0,0.02);
            cursor: pointer; display: flex; align-items: center; justify-content: space-between;
            transition: all 0.3s var(--ease-elastic);
        }
        .glass-select-trigger:hover {
            background: rgba(255, 255, 255, 0.45);
            transform: translateY(-1px);
        }
        body.dark-mode .glass-select-trigger:hover { background: rgba(255, 255, 255, 0.12); }
        
        .glass-select-container.open .glass-select-trigger {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
            background: rgba(255, 255, 255, 0.6);
            transform: scale(1.01);
        }
        body.dark-mode .glass-select-container.open .glass-select-trigger {
            background: rgba(15, 23, 42, 0.65);
        }
        
        .glass-select-trigger.disabled {
            opacity: 0.45; cursor: not-allowed; pointer-events: none;
        }

        .glass-arrow {
            width: 8px; height: 8px; border-right: 2px solid var(--text-muted); border-bottom: 2px solid var(--text-muted);
            transform: rotate(45deg); transition: transform 0.35s var(--ease-elastic); margin-right: 2px;
        }
        .glass-select-container.open .glass-arrow {
            transform: rotate(225deg) translateY(-2px); border-color: var(--primary);
        }

        /* เมนูดรอปดาวน์ */
        .glass-options-panel {
            position: absolute; top: calc(100% + 8px); left: 0; width: 100%; max-height: 220px;
            overflow-y: auto; z-index: 100;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.82) 0%, rgba(255, 255, 255, 0.45) 100%);
            backdrop-filter: blur(40px) saturate(220%); -webkit-backdrop-filter: blur(40px) saturate(220%);
            border: 1.5px solid rgba(255, 255, 255, 0.9); border-radius: 18px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.15), inset 0 1px 1px rgba(255, 255, 255, 0.9);
            padding: 8px;
            opacity: 0; visibility: hidden; transform: translateY(-12px) scale(0.95);
            transition: all 0.3s var(--ease-elastic);
        }
        body.dark-mode .glass-options-panel {
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.85) 0%, rgba(15, 23, 42, 0.6) 100%);
            border: 1.5px solid rgba(255, 255, 255, 0.22);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.65), inset 0 1px 1px rgba(255, 255, 255, 0.25);
        }
        .glass-select-container.open .glass-options-panel {
            opacity: 1; visibility: visible; transform: translateY(0) scale(1);
        }
        
        .glass-option-item {
            padding: 11px 15px; border-radius: 12px; font-size: 0.95rem; font-weight: 500;
            color: var(--text-main); cursor: pointer; transition: all 0.2s var(--ease-smooth);
        }
        .glass-option-item:hover {
            background: rgba(0, 122, 255, 0.15); color: var(--primary);
            transform: translateX(4px);
        }
        .glass-option-item.selected {
            background: var(--primary); color: #fff; font-weight: 600;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .glass-options-panel::-webkit-scrollbar { width: 5px; }
        .glass-options-panel::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.18); border-radius: 10px; }
        body.dark-mode .glass-options-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); }

        /* Buttons */
        .button-group { margin-top: 25px; }
        button { border: none; border-radius: 16px; padding: 15px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s var(--ease-elastic); font-family: inherit; }
        .btn-primary { 
            width: 100%; background: var(--primary); color: white; 
            box-shadow: 0 8px 24px var(--primary-glow); 
            backdrop-filter: blur(10px);
        }
        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 12px 30px var(--primary-glow);
        }
        .btn-primary:active { transform: scale(0.96); }

        /* Loader */
        .loader {
            padding: 11px 16px; border-radius: 16px; 
            background: var(--input-bg); color: var(--text-muted);
            font-size: 0.9rem; text-align: center; margin-bottom: 18px;
            display: flex; align-items: center; justify-content: center; gap: 14px;
            transition: all 0.4s ease;
            border: 1px solid var(--border-card);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
        }
        .loader.success { background: var(--success-bg); color: var(--success-text); border-color: rgba(34, 197, 94, 0.4); }
        .loader.error { background: var(--error-bg); color: var(--error-text); border-color: rgba(239, 68, 68, 0.4); }

        .loader-content { display: flex; align-items: center; gap: 10px; transition: opacity 0.3s ease; opacity: 1; }
        .loader-content.fade-out { opacity: 0; }
        .spinner { width: 18px; height: 18px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .btn-refresh-modern {
            width: 32px; height: 32px; border-radius: 50%; 
            background: var(--input-bg); color: var(--primary);
            border: 1px solid var(--border-card); box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.5s var(--ease-elastic);
            backdrop-filter: blur(10px);
        }
        .btn-refresh-modern:hover { transform: rotate(180deg) scale(1.12); color: var(--primary-dark); }
        .refresh-icon-svg { width: 18px; height: 18px; fill: currentColor; }

        /* 📦 Results Table Container */
        #result-container {
            display: flex; flex-direction: column; height: 60vh; 
            overflow: hidden; border: 1px solid var(--border-card); border-radius: 20px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.45);
            transition: all 0.3s;
        }
        body.dark-mode #result-container {
            background: rgba(0, 0, 0, 0.22);
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.12);
        }

        .summary-header { 
            background: var(--table-summary-bg); color: var(--primary); 
            padding: 14px 18px; font-weight: 600; border-bottom: 1px solid var(--table-summary-border); 
            display: flex; justify-content: space-between; flex-shrink: 0; 
            backdrop-filter: blur(15px);
        }
        .table-header { 
            display: flex; background: var(--table-header-bg); border-bottom: 1px solid var(--border-card); 
            padding: 12px 0; font-weight: 600; color: var(--text-muted); flex-shrink: 0; padding-right: 6px; 
            font-size: 0.9rem;
        }
        .table-body { flex: 1; overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth; }
        .table-body::-webkit-scrollbar { width: 5px; }
        .table-body::-webkit-scrollbar-track { background: var(--table-track); }
        .table-body::-webkit-scrollbar-thumb { background-color: var(--table-thumb); border-radius: 10px; }

        .flex-row { 
            display: flex; padding: 13px 0; border-bottom: 1px solid var(--table-row-border); align-items: center; 
            opacity: 0; transform: translateY(10px); animation: listEntry 0.4s var(--ease-elastic) forwards;
            transition: background-color 0.2s, transform 0.2s;
        }
        .flex-row:hover {
            background-color: rgba(255, 255, 255, 0.3);
            transform: translateX(3px);
        }
        body.dark-mode .flex-row:hover { background-color: rgba(255, 255, 255, 0.08); }
        @keyframes listEntry { to { opacity: 1; transform: translateY(0); } }

        .flex-col { padding: 0 18px; flex: 1; }
        .flex-col.right { text-align: right; }

        .highlight-row { background-color: var(--highlight-bg); }
        .highlight-row .flex-col:first-child { border-left: 4px solid var(--highlight-border); padding-left: 14px; }

        .small-row { background-color: var(--small-bg); }
        .small-row .flex-col:first-child { border-left: 4px solid var(--small-border); padding-left: 14px; }

        .badge-small {
            font-size: 0.72rem; font-weight: 600; background: rgba(249, 115, 22, 0.25);
            color: var(--small-border); padding: 3px 7px; border-radius: 7px;
            margin-left: 6px; vertical-align: middle; border: 1px solid rgba(249, 115, 22, 0.35);
        }

        .clickable-cell { 
            cursor: pointer; color: var(--primary); font-weight: 600; 
            text-decoration: none; display: inline-flex; align-items: center; gap: 5px; justify-content: flex-end; 
            transition: all 0.25s var(--ease-elastic); 
        }
        .clickable-cell:hover { transform: translateX(-4px) scale(1.05); }

        /* 📍 iOS Liquid Glass Modal (ถอดแบบ Dropdown รูป 2 พิกเซลต่อพิกเซล) */
        .modal-backdrop { 
            display: none; 
            position: fixed; 
            inset: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0, 0, 0, 0.15); /* ปรับฉากหลังไม่ให้มืดทึบ เพื่อให้กระจกเบลอฉากหลังได้เนียน */
            backdrop-filter: blur(8px); 
            -webkit-backdrop-filter: blur(8px);
            z-index: 2000; 
            align-items: center; 
            justify-content: center; 
            opacity: 0; 
            transition: opacity 0.25s var(--ease-smooth); 
        }
        .modal-backdrop.active { display: flex; opacity: 1; }
        
        .modal-content { 
            /* ไล่เฉดขาวสว่างด้านบน ลงมาโปร่งใสล่าง แบบเดียวกับ Dropdown Panel */
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.82) 0%, rgba(255, 255, 255, 0.45) 100%);
            border: 1.5px solid rgba(255, 255, 255, 0.9); 
            padding: 24px 20px 20px; 
            border-radius: 28px; 
            width: 90%; 
            max-width: 380px; 
            text-align: center; 
            box-shadow: 0 25px 50px -10px rgba(0, 0, 0, 0.15), 
                        inset 0 1.5px 1px 0 rgba(255, 255, 255, 1); 
            position: relative; 
            transform: scale(0.9) translateY(12px); 
            opacity: 0; 
            transition: all 0.35s var(--ease-elastic); 
            backdrop-filter: blur(35px) saturate(210%); 
            -webkit-backdrop-filter: blur(35px) saturate(210%);
        }
        body.dark-mode .modal-content {
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.85) 0%, rgba(15, 23, 42, 0.6) 100%);
            border: 1.5px solid rgba(255, 255, 255, 0.22);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(255, 255, 255, 0.25);
        }
        .modal-backdrop.active .modal-content { transform: scale(1) translateY(0); opacity: 1; }

        .modal-close { 
            position: absolute; top: 14px; right: 16px; font-size: 18px; 
            cursor: pointer; color: var(--text-muted); 
            width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; transition: all 0.2s;
        }
        .modal-close:hover { background: rgba(0,0,0,0.06); color: var(--text-main); }
        body.dark-mode .modal-close:hover { background: rgba(255,255,255,0.1); }

        /* 🌟 แคปซูลสีฟ้านีออน ถอดแบบแถบเลข 5 จากรูปที่ 2 */
        .modal-pill-highlight {
            background: #007aff;
            border-radius: 16px;
            padding: 12px 16px;
            margin: 14px 0 4px;
            box-shadow: 0 6px 16px rgba(0, 122, 255, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #modalLocationData {
            font-size: 1.3rem; 
            font-weight: 700; 
            color: #ffffff;
            letter-spacing: 0.5px; 
            word-break: break-all; 
            line-height: 1.3;
        }

        .disabled { opacity: 0.45; pointer-events: none; filter: grayscale(0.4); transition: 0.3s; }

        @media (max-width: 768px) {
            body { height: auto; overflow: auto; padding: 12px; }
            .layout-container { display: block; margin-top: 50px; }
            .card { margin-bottom: 20px; }
            .logo { width: 70px; top: 12px; right: 12px; }
            #result-container { height: 50vh; } 
            .version-tag { display: none; }
            .theme-toggle-btn { bottom: 12px; left: 12px; width: 40px; height: 40px; font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <img src="https://img2.pic.in.th/pic/images-removebg-preview6f60794d15581bfe.png" alt="Company Logo" class="logo">
    <div class="version-tag">Liquid Glass Edition</div>

    <button id="themeToggle" class="theme-toggle-btn" onclick="toggleTheme()" title="สลับโหมดมืด / โหมดสว่าง">
        🌙
    </button>

    <div class="layout-container">
        
        <div class="card" style="animation-delay: 0.1s;">
            <h2>🔎 ค้นหากระจก</h2>
            
            <div id="loader-status" class="loader">
                <div id="loader-content-wrapper" class="loader-content">
                    <div class="spinner"></div> <span>Connecting...</span>
                </div>
            </div>

            <div id="form-wrapper" class="disabled">
                <!-- Select ความหนา -->
                <div class="form-group">
                    <label>ความหนา</label>
                    <select id="thicknessInput" class="native-hidden-select" onchange="updateColorOptions()">
                        <option value="">-- รอข้อมูล --</option>
                    </select>
                    
                    <div id="thicknessCustom" class="glass-select-container">
                        <div class="glass-select-trigger" onclick="toggleCustomDropdown('thicknessCustom')">
                            <span class="glass-selected-text">-- รอข้อมูล --</span>
                            <span class="glass-arrow"></span>
                        </div>
                        <div class="glass-options-panel"></div>
                    </div>
                </div>

                <!-- Select สี -->
                <div class="form-group">
                    <label>สี</label>
                    <select id="colorInput" class="native-hidden-select" disabled>
                        <option value="">-- เลือกความหนาก่อน --</option>
                    </select>
                    
                    <div id="colorCustom" class="glass-select-container">
                        <div class="glass-select-trigger disabled" onclick="toggleCustomDropdown('colorCustom')">
                            <span class="glass-selected-text">-- เลือกความหนาก่อน --</span>
                            <span class="glass-arrow"></span>
                        </div>
                        <div class="glass-options-panel"></div>
                    </div>
                </div>

                <div class="button-group">
                    <button onclick="findAllMatches()" class="btn-primary">
                        ค้นหา
                    </button>
                </div>
            </div>
        </div>

        <div class="card" style="animation-delay: 0.2s;">
            <h2 style="margin-bottom: 15px;">📦 รายการกระจก</h2>
            <div id="result-container">
                <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-muted);">
                    <img src="https://cdn-icons-png.flaticon.com/512/7486/7486744.png" width="60" style="opacity: 0.3; margin-bottom: 15px;">
                    <div>กรุณาเลือกข้อมูลเพื่อค้นหา</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal ตัวใหม่ ถอดแบบ Liquid Glass ตามรูปที่ 2 คลีนตา ไร้กรอบทับ -->
    <div id="locationModal" class="modal-backdrop" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <div style="font-size: 1rem; font-weight: 600; color: var(--text-main); display: flex; align-items: center; justify-content: center; gap: 6px;">
                📍 <span>ตำแหน่งเก็บ</span>
            </div>
            <div class="modal-pill-highlight">
                <div id="modalLocationData">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzMdBbCfyGwd4W-gIBCrS5FcDjyBO4VugS-vWcYWZbbj02E3g2tLlgUGsv7aWZnZN5Q/exec'; 
        const REFRESH_ICON_SVG = `<svg class="refresh-icon-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M19.9381 13C19.979 12.6724 20 12.3387 20 12C20 7.58172 16.4183 4 12 4C9.49942 4 7.26681 5.14727 5.7998 6.94416M5.7998 6.94416V4M5.7998 6.94416H8.96917M4.06189 11C4.02104 11.3276 4 11.6613 4 12C4 16.4183 7.58172 20 12 20C14.3894 20 16.5341 18.9525 18 17.2916M18 17.2916V20M18 17.2916H14.8308" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

        let excelDataCache = null;

        function initTheme() {
            const savedTheme = localStorage.getItem('ksg_theme');
            const themeBtn = document.getElementById('themeToggle');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
                themeBtn.textContent = '☀️';
            } else {
                document.body.classList.remove('dark-mode');
                themeBtn.textContent = '🌙';
            }
        }

        function toggleTheme() {
            const isDark = document.body.classList.toggle('dark-mode');
            const themeBtn = document.getElementById('themeToggle');
            if (isDark) {
                themeBtn.textContent = '☀️';
                localStorage.setItem('ksg_theme', 'dark');
            } else {
                themeBtn.textContent = '🌙';
                localStorage.setItem('ksg_theme', 'light');
            }
        }

        window.onload = function() {
            initTheme();
            loadData();
        };

        function toggleCustomDropdown(containerId) {
            const target = document.getElementById(containerId);
            const isOpen = target.classList.contains('open');
            closeAllCustomDropdowns();
            if (!isOpen) target.classList.add('open');
        }

        function closeAllCustomDropdowns() {
            document.querySelectorAll('.glass-select-container').forEach(el => el.classList.remove('open'));
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.glass-select-container')) {
                closeAllCustomDropdowns();
            }
        });

        function syncCustomDropdownUI(selectId, customContainerId) {
            const select = document.getElementById(selectId);
            const container = document.getElementById(customContainerId);
            const trigger = container.querySelector('.glass-select-trigger');
            const selectedText = container.querySelector('.glass-selected-text');
            const panel = container.querySelector('.glass-options-panel');

            if (select.disabled) {
                trigger.classList.add('disabled');
            } else {
                trigger.classList.remove('disabled');
            }

            const currentOption = select.options[select.selectedIndex];
            selectedText.textContent = currentOption ? currentOption.text : '-- เลือก --';

            panel.innerHTML = '';
            Array.from(select.options).forEach((opt) => {
                const item = document.createElement('div');
                item.className = `glass-option-item ${opt.value === select.value ? 'selected' : ''}`;
                item.textContent = opt.text;
                item.onclick = function(e) {
                    e.stopPropagation();
                    select.value = opt.value;
                    select.dispatchEvent(new Event('change'));
                    closeAllCustomDropdowns();
                    syncCustomDropdownUI(selectId, customContainerId);
                };
                panel.appendChild(item);
            });
        }

        function updateLoaderState(state, htmlContent) {
            const loader = document.getElementById('loader-status');
            const contentWrapper = document.getElementById('loader-content-wrapper');
            contentWrapper.classList.add('fade-out');
            setTimeout(() => {
                loader.className = `loader ${state}`;
                contentWrapper.innerHTML = htmlContent;
                contentWrapper.classList.remove('fade-out');
            }, 300);
        }

        function loadData() {
            const wrapper = document.getElementById('form-wrapper');
            wrapper.classList.add('disabled');
            updateLoaderState('', '<div class="spinner"></div> <span>☁️ กำลังโหลดข้อมูล...</span>');

            Papa.parse(GOOGLE_APPS_SCRIPT_URL, {
                download: true, header: true, skipEmptyLines: true,
                complete: function(results) {
                    excelDataCache = results.data;
                    const updateTime = (excelDataCache.length > 0 && excelDataCache[0]['Update']) ? excelDataCache[0]['Update'] : '-';
                    
                    populateDropdown('thicknessInput', excelDataCache, 'ความหนา', true);
                    syncCustomDropdownUI('thicknessInput', 'thicknessCustom');
                    
                    document.getElementById('colorInput').innerHTML = '<option value="">-- เลือกความหนาก่อน --</option>';
                    document.getElementById('colorInput').disabled = true;
                    syncCustomDropdownUI('colorInput', 'colorCustom');

                    updateLoaderState('success', `
                        <span>✅ ข้อมูลล่าสุด: <b>${updateTime}</b></span>
                        <button onclick="reloadData()" class="btn-refresh-modern" title="อัปเดตข้อมูล">
                            ${REFRESH_ICON_SVG}
                        </button>
                    `);
                    wrapper.classList.remove('disabled');
                },
                error: function(err) {
                    updateLoaderState('error', `โหลดไม่สำเร็จ <button onclick="reloadData()" class="btn-refresh-modern">${REFRESH_ICON_SVG}</button>`);
                }
            });
        }

        function reloadData() {
            const btn = document.querySelector('.btn-refresh-modern');
            if(btn) btn.style.transform = 'rotate(360deg)'; 
            excelDataCache = null;
            document.getElementById('result-container').innerHTML = `
                <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-muted);">
                    <div>กำลังรีเฟรช...</div>
                </div>`;
            loadData();
        }

        function populateDropdown(elId, data, key, sortNum) {
            const select = document.getElementById(elId);
            const values = new Set();
            data.forEach(r => { if(r[key]) values.add(String(r[key]).trim()); });
            let sorted = Array.from(values);
            if(sortNum) sorted.sort((a,b) => parseFloat(a) - parseFloat(b)); else sorted.sort();
            select.innerHTML = `<option value="">-- เลือก${key} --</option>`;
            sorted.forEach(val => {
                const opt = document.createElement('option');
                opt.value = val; opt.textContent = val; select.appendChild(opt);
            });
        }

        function updateColorOptions() {
            const thk = document.getElementById('thicknessInput').value;
            const colSel = document.getElementById('colorInput');
            
            if(!thk) { 
                colSel.disabled = true; 
                colSel.innerHTML = '<option value="">-- เลือกความหนาก่อน --</option>'; 
                syncCustomDropdownUI('colorInput', 'colorCustom');
                return; 
            }

            const filtered = excelDataCache.filter(r => String(r['ความหนา']).trim() === thk);
            populateDropdown('colorInput', filtered, 'สี', false);
            
            colSel.disabled = false;
            syncCustomDropdownUI('colorInput', 'colorCustom');
        }

        function findAllMatches() {
            const thk = document.getElementById('thicknessInput').value;
            const col = document.getElementById('colorInput').value;
            if(!thk || !col) { alert('กรุณาเลือกข้อมูลให้ครบ'); return; }

            const minArea = 84 * 96;
            const highlightArea = 108 * 144;
            
            let matches = excelDataCache.filter(r => 
                String(r['ความหนา']).trim() === thk && String(r['สี']).trim() === col
            ).map(r => {
                const parts = (r['ขนาด']||'').toLowerCase().split('x');
                const w = parseFloat(parts[0])||0; const h = parseFloat(parts[1])||0;
                return { ...r, area: w*h, w: w };
            });
            
            matches.sort((a,b) => a.w - b.w);

            const resultContainer = document.getElementById('result-container');
            if(matches.length === 0) {
                resultContainer.innerHTML = `<div style="padding:20px; text-align:center; color:#ef4444;">❌ ไม่พบขนาดที่ต้องการ</div>`;
                return;
            }

            let headerHTML = `
                <div class="summary-header">
                    <span>${thk} / ${col}</span>
                    <span>พบ ${matches.length} รายการ</span>
                </div>
                <div class="table-header">
                    <div class="flex-col">ขนาด </div>
                    <div class="flex-col right">คงเหลือ / ตำแหน่ง</div>
                </div>
            `;

            let bodyHTML = `<div class="table-body">`;
            matches.forEach((item, index) => {
                let rowClass = '';
                let badgeHTML = '';

                if (item.area >= highlightArea) {
                    rowClass = 'highlight-row';
                } else if (item.area < minArea) {
                    rowClass = 'small-row';
                    badgeHTML = `<span class="badge-small">ไซส์เล็ก</span>`;
                }

                const loc = item['ตำแหน่ง'] || '-';
                
                let qty = item['คงเหลือ'];
                if (qty === undefined || qty === null || String(qty).trim() === '') { qty = '0'; }
                let qtyDisplay = qty;
                if (parseFloat(qty) === 0) {
                    qtyDisplay = `<span style="color: var(--error-text); font-weight: bold;">${qty}</span>`;
                }

                const delay = index * 0.04; 

                bodyHTML += `
                    <div class="flex-row ${rowClass}" style="animation-delay: ${delay}s;">
                        <div class="flex-col" style="font-weight:bold;">
                            ${item['ขนาด']} ${badgeHTML}
                        </div>
                        <div class="flex-col right">
                            ${qtyDisplay} แผ่น &nbsp;
                            <a href="#" class="clickable-cell" onclick="showLocation('${loc}')">📍 ดูตำแหน่ง</a>
                        </div>
                    </div>
                `;
            });
            bodyHTML += `</div>`;

            resultContainer.innerHTML = headerHTML + bodyHTML;
        }

        function showLocation(loc) {
            document.getElementById('modalLocationData').textContent = loc;
            const modal = document.getElementById('locationModal');
            modal.style.display = 'flex';
            setTimeout(() => { modal.classList.add('active'); }, 10);
        }
        
        function closeModal() {
            const modal = document.getElementById('locationModal');
            modal.classList.remove('active');
            setTimeout(() => { modal.style.display = 'none'; }, 300);
        }
    </script>
</body>
</html>
